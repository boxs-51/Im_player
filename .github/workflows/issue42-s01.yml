name: S01 Audio Boundary Oracle
on:
  pull_request:
    branches: [alpha]
    paths:
      - 'scripts/issue42_first_boundary.py'
      - 'scripts/issue42_s01_physical.ps1'
      - 'tests/test_issue42_first_boundary.py'
      - 'tests/test_issue42_adversarial.py'
      - 'tests/test_issue42_multi_underflow.py'
      - 'tests/test_issue42_shutdown_ambiguity.py'
      - 'tests/test_issue42_lifecycle_identity.py'
      - 'tests/test_issue42_native_marker_parity.py'
      - 'tests/test_issue42_raw_underflow.py'
      - 'tests/test_issue42_telemetry_v2_redfirst.py'
      - 'tests/test_issue42_v2_cli_gate.py'
      - 'tests/test_issue42_v2_strict_provenance.py'
      - 'tests/test_issue42_native_session_correlation.py'
      - 'tests/test_issue42_native_v1_lineage.py'
      - 'tests/test_issue42_device_pipe_provenance.py'
      - 'tests/test_issue42_mpv_cache_property.py'
      - 'native/src/player/event/PlaybackObserver.cpp'
      - 'native/src/player/audio/AudioSessionIdentity.h'
      - 'native/src/player/audio/AudioTypes.h'
      - 'native/src/player/audio/Audio.h'
      - 'native/src/player/audio/Audio.cpp'
      - 'native/src/player/audio/AudioCaptureManager.h'
      - 'native/src/player/audio/AudioCaptureManager.cpp'
      - 'native/src/player/audio/AudioProcessor.cpp'
      - 'native/src/player/audio/AudioOutputWorker.cpp'
      - 'native/src/player/session/PlayerSession.h'
      - 'native/src/player/session/PlayerSession.cpp'
      - 'docs/alpha/S01_TELEMETRY_CORRELATION_V2_ADR.md'
      - '.github/workflows/issue42-s01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace-fixture:
    name: S01 synthetic trace contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run Python stdlib trace tests
        run: python -m unittest discover -s tests -p 'test_issue42_*.py' -v
      - name: Validate physical capture script syntax (not GUI E2E)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/issue42_s01_physical.ps1'),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | ForEach-Object Message) }
          Write-Host "PowerShell parser PASS; physical playback NOT_RUN_IN_CI"
      - name: Validate ColdUrl/Local route without launching Im_player
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'scripts/issue42_s01_physical.ps1'
          $remote = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Configuration Debug -MediaUrl 'https://example.invalid/fixture' -PlanOnly
          if ($LASTEXITCODE -ne 0 -or ($remote -join "`n") -notmatch 'scenario=ColdUrl.*physical=NOT_RUN') {
            throw 'S01 remote route plan did not prove ColdUrl without effects'
          }
          $local = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Configuration Release -PlanOnly
          if ($LASTEXITCODE -ne 0 -or ($local -join "`n") -notmatch 'scenario=Local.*physical=NOT_RUN') {
            throw 'S01 local route plan did not prove Local without effects'
          }
          Write-Host 'S01 no-effect route plans PASS; physical playback NOT_RUN_IN_CI'

